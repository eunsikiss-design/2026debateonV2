<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스피치 · 디베이트온</title><link rel="stylesheet" href="/assets/cyber.css"><link rel="stylesheet" href="/assets/learning.css"><script defer src="/assets/cyber-ui.js"></script><script src="/assets/learning-ui.js"></script><script src="/assets/topic-catalog.js"></script><script defer src="/assets/speech-live.js"></script></head>
<body data-screen="speech" class="learning-shell"><header></header><main>
<section class="learning-panel"><p class="learning-kicker">말하기 주제</p><h2 id="topic-question">주제를 불러오고 있습니다.</h2><div id="lesson-context"></div></section>
<section class="learning-panel guided-form"><h2>말하기 전에 생각 정리하기</h2><p>짧은 질문에 답하면 말할 순서를 개요로 보여 드립니다.</p>
<label>이 상황에서 내 주장은 무엇인가요?<textarea id="speech-claim" placeholder="누구의 입장에서 무엇을 선택할지 적어 보세요."></textarea></label>
<label>그렇게 생각하는 가장 중요한 이유는 무엇인가요?<textarea id="speech-reason" placeholder="이야기의 구체적인 사실이나 교과 개념을 연결해 보세요."></textarea></label>
<label>다른 사람의 걱정이나 필요한 조건은 무엇인가요? (선택)<textarea id="speech-condition" placeholder="예외, 조건, 다른 입장의 질문을 생각해 보세요."></textarea></label>
<div class="guided-actions"><button type="button" id="show-outline-btn">말하기 개요 보기</button></div>
<div id="speech-outline" class="speech-outline" hidden aria-live="polite"></div></section>
<section class="learning-panel guided-form" aria-label="스피치 훈련"><h2>스피치하기</h2><label>목표 시간<select id="speech-target"><option value="45">45초</option><option value="90">1분 30초</option><option value="180">3분</option><option value="300">5분</option></select></label>
<p id="timer-digits" class="speech-timer" aria-label="말한 시간">00:00</p><p id="speech-live-state" class="speech-status" role="status">READY</p>
<div class="guided-actions"><button type="button" id="start-btn" disabled>시작하기</button><button type="button" id="pause-btn" disabled>일시 멈춤</button><button type="button" id="finish-btn" disabled>완료</button><button type="button" id="restart-btn" disabled>다시 시작</button></div>
<p id="speech-privacy">원본 음성은 저장하지 않고, 말한 내용을 글로 바꾼 전사문만 제출합니다.</p><div id="speech-transcript" class="speech-transcript" aria-live="polite">말하기를 시작하면 내용이 여기에 표시됩니다.</div><p id="speech-word-count">0어절</p><p id="speech-message" role="status" class="learning-status"></p>
<section id="speech-feedback" hidden aria-live="polite"><h2>소크라AI의 피드백</h2><p id="speech-eval-praise"></p><p id="speech-eval-growth"></p><p id="speech-eval-question"></p><p class="learning-status">전사문만으로 목소리의 전달력이나 발음을 평가하지 않습니다.</p></section></section>
</main></body></html>
